version: '3.9'
services:
  db:
    image: postgres:16
    container_name: finance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_app
    ports:
      - '5432:5432'
    volumes:
      - finance-db-data:/var/lib/postgresql/data

volumes:
  finance-db-data:
